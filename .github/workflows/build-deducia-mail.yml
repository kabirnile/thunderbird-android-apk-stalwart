name: Build Deducia Mail APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Custom Logo Assets
        run: |
          if [ -f "ic_launcher.png" ]; then
            echo "Applying custom ic_launcher.png across resources..."
            find app-thunderbird/src/main/res/ -iname "ic_launcher*.xml" -delete
            find app-thunderbird/src/main/res/ -iname "ic_app_logo*.xml" -delete
            find app-thunderbird/src/main/res/ -iname "ic_launcher*.png" -exec cp -f ic_launcher.png {} \;
            find app-thunderbird/src/main/res/ -iname "ic_app_logo*.png" -exec cp -f ic_launcher.png {} \;
          fi

      - name: Apply Deducia Mail Customizations & Branding Stripping
        run: |
          echo "Applying strict Deducia Mail patches..."

          # 1. Force release build to use debug signing key so APK is fully optimized & installable
          sed -i 's/signingConfig = signingConfigs.getByType(SigningType.TB_RELEASE)/signingConfig = signingConfigs.getByName("debug")/' app-thunderbird/build.gradle.kts

          # 2. Hardcode Autodiscovery to ONLY use Deducia Mail Server (email.deducia.com) for ALL inputs
          find . -name "*Autodiscovery*.kt" -o -name "*Autoconfig*.kt" | xargs -I {} sed -i 's/autodiscoverUrl.*/"email.deducia.com"/g' {} 2>/dev/null || true

          # 3. Strip Thundermail and QR Code options from Onboarding
          find feature/onboarding/ -type f -name "*.kt" -o -name "*.xml" | xargs -I {} sed -i 's/Sign in with Thundermail//g' {} 2>/dev/null || true
          find feature/onboarding/ -type f -name "*.kt" -o -name "*.xml" | xargs -I {} sed -i 's/Scan QR code//g' {} 2>/dev/null || true

          # 4. Inject Account Creation Link in Onboarding
          find feature/onboarding/ -type f -name "*.kt" -exec sed -i 's|Thundermail|https://signup.mail.deducia.com/|g' {} + 2>/dev/null || true

          # 5. Remove Thunderbird/Mozilla Links from About, Get Help, and Support Screens
          find feature/about/ -type f -name "*.kt" -o -name "*.xml" | xargs -I {} sed -i 's|https://.*thunderbird.*|https://signup.mail.deducia.com/|g' {} 2>/dev/null || true
          find feature/settings/ -type f -name "*.kt" -o -name "*.xml" | xargs -I {} sed -i 's|https://.*thunderbird.*|https://signup.mail.deducia.com/|g' {} 2>/dev/null || true

          # 6. Bypass Special Folders configuration screen (Direct to Inbox)
          find feature/account/ -type f -name "*.kt" -exec sed -i 's/showFolderSetup.*/skipToInbox()/g' {} + 2>/dev/null || true

          echo "Patches successfully applied."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Build Optimized Release APK
        run: ./gradlew clean :app-thunderbird:assembleFossRelease --no-daemon

      - name: Upload Ultra-Fast Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DeduciaMail-UltraFast-APK
          path: app-thunderbird/build/outputs/apk/foss/release/*.apk
