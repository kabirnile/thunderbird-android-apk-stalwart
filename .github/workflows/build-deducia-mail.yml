name: Build Deducia Mail APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Force Apply Root Logo to All Android Resources
        run: |
          if [ ! -f "ic_launcher.png" ]; then
            echo "Error: ic_launcher.png not found in root directory!"
            exit 1
          fi

          echo "Applying root ic_launcher.png..."

          # 1. Delete adaptive icon XML files forcing old vector artwork
          find app-thunderbird/src/main/res/ -iname "ic_launcher*.xml" -delete
          find app-thunderbird/src/main/res/ -iname "ic_app_logo*.xml" -delete

          # 2. Overwrite all PNG launcher and drawable assets across all density folders
          find app-thunderbird/src/main/res/ -iname "ic_launcher*.png" -exec cp -f ic_launcher.png {} \;
          find app-thunderbird/src/main/res/ -iname "ic_app_logo*.png" -exec cp -f ic_launcher.png {} \;

          echo "Logo replacement complete."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Clean & Build Auto-Signed Debug APK
        run: ./gradlew clean :app-thunderbird:assembleFossDebug --no-daemon

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DeduciaMail-Installable-APK
          path: app-thunderbird/build/outputs/apk/foss/debug/*.apk
