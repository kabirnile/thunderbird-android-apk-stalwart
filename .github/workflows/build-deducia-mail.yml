name: Build Deducia Mail APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fix and Replace All Logos
        run: |
          if [ ! -f "ic_launcher.png" ]; then
            echo "Error: ic_launcher.png not found in root directory!"
            exit 1
          fi

          echo "Replacing icons and populating missing drawable references..."

          # Remove XML vector files that override PNG icons
          find app-thunderbird/src/main/res/ -iname "ic_launcher*.xml" -delete
          find app-thunderbird/src/main/res/ -iname "ic_app_logo*.xml" -delete
          find app-thunderbird/src/main/res/ -iname "thunderbird_logo*.xml" -delete

          # Copy root ic_launcher.png into every drawable and mipmap folder as ic_app_logo.png and ic_launcher.png
          find app-thunderbird/src/main/res/ -type d \( -name "drawable*" -o -name "mipmap*" \) | while read -r dir; do
            cp -f ic_launcher.png "$dir/ic_launcher.png"
            cp -f ic_launcher.png "$dir/ic_app_logo.png"
            cp -f ic_launcher.png "$dir/thunderbird_logo.png"
          done

      - name: Patch UI Layouts & Enforce Deducia Mail Rules
        run: |
          echo "Patching strings and UI configuration..."

          # 1. Hide 'Sign in with Thundermail' and 'Scan QR Code' buttons
          find app-thunderbird/ -iname "*.xml" -exec sed -i 's/android:id="@+id\/thundermail_button"/android:id="@+id\/thundermail_button" android:visibility="gone"/g' {} +
          find app-thunderbird/ -iname "*.xml" -exec sed -i 's/android:id="@+id\/qr_code_button"/android:id="@+id\/qr_code_button" android:visibility="gone"/g' {} +

          # 2. Add Sign-Up Link redirect
          find app-thunderbird/ -iname "strings.xml" -exec sed -i 's/Create account/Create account at https:\/\/signup.mail.deducia.com\//g' {} +

          # 3. Strip external About, Help, and Support Thunderbird URLs
          find app-thunderbird/ -iname "strings.xml" -exec sed -i 's/https:\/\/support.mozilla.org[^"]*/https:\/\/deducia.com/g' {} +
          find app-thunderbird/ -iname "strings.xml" -exec sed -i 's/https:\/\/www.thunderbird.net[^"]*/https:\/\/deducia.com/g' {} +

          # 4. Enforce Deducia Mail Server for all domains
          find . -iname "*.kt" -o -iname "*.java" | xargs sed -i 's/imap\.googlemail\.com/email.deducia.com/g' || true
          find . -iname "*.kt" -o -iname "*.java" | xargs sed -i 's/pop\.googlemail\.com/email.deducia.com/g' || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Build Optimized Release APK
        run: ./gradlew clean :app-thunderbird:assembleFossRelease --no-daemon

      - name: Auto-Sign Release APK
        run: |
          sudo apt-get update && sudo apt-get install -y apksigner
          
          # Generate temporary release keystore
          keytool -genkey -v -keystore release.jks -alias deducia -keyalg RSA -keysize 2048 -validity 10000 -storepass deducia123 -keypass deducia123 -dname "CN=Deducia, OU=Mail, O=Deducia, L=City, C=IN"
          
          # Find and sign the generated release APK
          RELEASE_APK=$(find app-thunderbird/build/outputs/apk/ -name "*release-unsigned.apk" -o -name "*release.apk" | head -n 1)
          
          if [ -f "$RELEASE_APK" ]; then
            apksigner sign --ks release.jks --ks-pass pass:deducia123 --key-pass pass:deducia123 --out app-deducia-mail-release.apk "$RELEASE_APK"
            echo "APK successfully signed."
          else
            echo "Error: Release APK not found!"
            exit 1
          fi

      - name: Upload Fast Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DeduciaMail-Ultrafast-Release-APK
          path: app-deducia-mail-release.apk
